
name: Application Security

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install pytest bandit pip-audit

      - name: Security scan
        run: bandit -r app.py

      - name: Check dependencies
        run: pip-audit

      - name: Run tests
        run: pytest -v --junitxml=test-report.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.xml
          if-no-files-found: warn
